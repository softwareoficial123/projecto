services:
  db:
    image: postgres:15-alpine
    container_name: monorepo_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"

  api:
    image: projecto-api:prod
    container_name: api-prod
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydb
      - NODE_ENV=production
    depends_on:
      - db

  web:
    image: projecto-web:prod
    container_name: web-prod
    ports:
      - "3000:8080"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NODE_ENV=production
    depends_on:
      - api
